change_log:
  - "Roll range widened from +/-0.015 rad to +/-0.05 rad after M02 hit the arbitrary initial bound; previous constrained fits retained. Camera tilt/shift are explicitly fitted, not silently changed between comparisons."
  - "M03 eastern terminal-face axis corrected from SE-facing window to narrow east-facing terminal window (u=758); original pick retained in earlier reports. M02 corresponding terminal face u=986. Foot points partly occluded, sigma=12 px. Ground control prevents a roof-only fit from silently placing the building below the street."
  - "Centered tilted-camera hypotheses retained in baseline/visible_controls/linear reports. Enlarged M11 window jambs show near-parallel verticals; shifted horizontal camera replaces centred principal point. Photo pixels and model dimensions unchanged for this test."
  - "Initial picks retained in phase_a_002_baseline report. M11 ground axes corrected after enlarged base inspection (bus obscures bases); all tower ground axes changed to low-confidence checks. M03 base points are occluded and excluded; roof ridges substitute as visible fitting controls. This changes correspondences explicitly, not reference pixels."
